name = "klipded-api"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# 1) npx wrangler d1 create klipded
# 2) paste the database_id it prints below
[[d1_databases]]
binding = "DB"
database_name = "klipded"
database_id = "14b45f79-5ce7-4b88-b28d-3ee6163a8af8"

[vars]
# Put your website origin here after it is online, e.g. "https://n0bss.github.io"
ALLOWED_ORIGINS = "https://n0bss.github.io,http://localhost:8080,http://127.0.0.1:8080"
GROQ_STT_MODEL = "whisper-large-v3"
GROQ_LLM_MODEL = "openai/gpt-oss-120b"
GEMINI_MODEL = "gemini-flash-latest"
GEMINI_FALLBACK_MODEL = "gemini-flash-lite-latest"
KEY_PREFIX = "KD"
HIGHLIGHTS_PER_DAY = "40"

# Secrets (never put them in this file):
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put ADMIN_TOKEN
